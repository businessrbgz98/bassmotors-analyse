<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bass Motors — Marktanalyse</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #f0a500;
    --accent2: #e05c00;
    --green: #00c896;
    --red: #ff4d6d;
    --text: #e8eaf0;
    --muted: #6b7280;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header h1 {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #f0a500 0%, #ff6b35 60%, #e8eaf0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
    font-family: 'DM Mono', monospace;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }

  /* FORM GRID */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--surface2); }

  /* PRICE ROW */
  .price-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .price-highlight {
    position: relative;
  }
  .price-highlight input {
    border-color: var(--accent2);
    padding-left: 30px;
  }
  .price-highlight::before {
    content: '€';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    pointer-events: none;
  }

  /* BTN */
  .btn-analyse {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: var(--radius);
    color: #0d0f14;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-analyse:active { transform: scale(0.98); opacity: 0.9; }
  .btn-analyse:disabled { opacity: 0.4; cursor: not-allowed; }

  /* AUTOSCOUT LINK */
  .scout-link {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    text-decoration: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    transition: border-color 0.2s;
    margin-top: 12px;
    overflow: hidden;
  }
  .scout-link:hover { border-color: var(--accent); }
  .scout-link .icon { font-size: 18px; flex-shrink: 0; }
  .scout-link .url { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scout-link .label { font-size: 10px; color: var(--accent); letter-spacing: 1px; flex-shrink: 0; }

  /* LOADER */
  .loader {
    display: none;
    text-align: center;
    padding: 32px;
  }
  .loader.active { display: block; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: var(--muted); font-size: 13px; font-family: 'DM Mono', monospace; }

  /* RESULT */
  .result { display: none; }
  .result.active { display: block; }

  /* VERDICT BANNER */
  .verdict {
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .verdict.go { background: rgba(0,200,150,0.12); border: 1px solid rgba(0,200,150,0.3); }
  .verdict.nogo { background: rgba(255,77,109,0.12); border: 1px solid rgba(255,77,109,0.3); }
  .verdict.maybe { background: rgba(240,165,0,0.12); border: 1px solid rgba(240,165,0,0.3); }
  .verdict-icon { font-size: 36px; }
  .verdict-text h2 { font-size: 20px; font-weight: 800; }
  .verdict.go .verdict-text h2 { color: var(--green); }
  .verdict.nogo .verdict-text h2 { color: var(--red); }
  .verdict.maybe .verdict-text h2 { color: var(--accent); }
  .verdict-text p { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .metric {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .metric-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .metric-value { font-size: 22px; font-weight: 800; font-family: 'DM Mono', monospace; }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.orange { color: var(--accent); }
  .metric-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }

  /* AI ANALYSE TEXT */
  .ai-analyse {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    font-family: 'DM Mono', monospace;
  }

  /* RESET BTN */
  .btn-reset {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    cursor: pointer;
    margin-top: 12px;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* ERROR */
  .error-box {
    display: none;
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.3);
    border-radius: var(--radius);
    padding: 16px;
    color: var(--red);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    margin-top: 12px;
  }
  .error-box.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Bass Motors</div>
  <h1>Marktwaarde<br>Analyser</h1>
  <p>AutoScout24 · AI-gestuurde marge-analyse</p>
</div>

<!-- FORM CARD -->
<div class="card" id="formCard">
  <div class="card-title">Voertuiggegevens</div>

  <div class="form-grid">
    <div class="form-group">
      <label>Merk</label>
      <input type="text" id="merk" placeholder="BMW" />
    </div>
    <div class="form-group">
      <label>Model</label>
      <input type="text" id="model" placeholder="3 Serie" />
    </div>
    <div class="form-group">
      <label>Bouwjaar</label>
      <input type="number" id="jaar" placeholder="2019" min="1990" max="2026" />
    </div>
    <div class="form-group">
      <label>Kilometerstand</label>
      <input type="number" id="km" placeholder="85000" />
    </div>
    <div class="form-group full">
      <label>Uitvoering / Versie (optioneel)</label>
      <input type="text" id="uitvoering" placeholder="320d xDrive M Sport" />
    </div>
    <div class="form-group">
      <label>Brandstof</label>
      <select id="brandstof">
        <option value="">Alle</option>
        <option value="D">Diesel</option>
        <option value="B">Benzine</option>
        <option value="E">Elektrisch</option>
        <option value="H">Hybride</option>
        <option value="L">LPG</option>
      </select>
    </div>
    <div class="form-group">
      <label>Transmissie</label>
      <select id="transmissie">
        <option value="">Alle</option>
        <option value="A">Automaat</option>
        <option value="M">Manueel</option>
      </select>
    </div>
  </div>

  <div class="card-title" style="margin-top:24px;">Financieel</div>
  <div class="price-row">
    <div class="form-group">
      <label>Jouw aankoopprijs (€)</label>
      <div class="price-highlight">
        <input type="number" id="aankoopprijs" placeholder="12500" />
      </div>
    </div>
    <div class="form-group">
      <label>Gewenste marge (%)</label>
      <input type="number" id="marge" placeholder="15" min="1" max="100" />
    </div>
  </div>

  <button class="btn-analyse" id="analyseBtn" onclick="startAnalyse()">
    🔍 Analyseer marktwaarde
  </button>

  <div class="error-box" id="errorBox"></div>

  <a href="#" id="scoutLink" class="scout-link" target="_blank" style="display:none">
    <span class="icon">🔗</span>
    <span class="url" id="scoutUrl"></span>
    <span class="label">OPEN →</span>
  </a>
</div>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Markt wordt geanalyseerd via AI...</p>
</div>

<!-- RESULT -->
<div class="result" id="result">
  <div class="verdict" id="verdict">
    <div class="verdict-icon" id="verdictIcon"></div>
    <div class="verdict-text">
      <h2 id="verdictTitle"></h2>
      <p id="verdictSub"></p>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Marktprijs schatting</div>
      <div class="metric-value orange" id="metMarkt">—</div>
      <div class="metric-sub" id="metMarktSub"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Jouw aankoopprijs</div>
      <div class="metric-value" id="metAankoop">—</div>
      <div class="metric-sub">incl. gewenste marge</div>
    </div>
    <div class="metric">
      <div class="metric-label">Geschatte winst</div>
      <div class="metric-value" id="metWinst">—</div>
      <div class="metric-sub" id="metWinstSub"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Aanbevolen verkoopprijs</div>
      <div class="metric-value orange" id="metVerkoop">—</div>
      <div class="metric-sub" id="metVerkoopSub"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">AI Marktanalyse</div>
    <div class="ai-analyse" id="aiAnalyse"></div>
  </div>

  <a href="#" id="scoutLinkResult" class="scout-link" target="_blank">
    <span class="icon">🔗</span>
    <span class="url" id="scoutUrlResult"></span>
    <span class="label">AUTOSCOUT24 →</span>
  </a>

  <button class="btn-reset" onclick="resetForm()">← Nieuwe analyse</button>
</div>

<script>
  function buildAutoScoutUrl(merk, model, jaar, km, brandstof, transmissie) {
    const base = 'https://www.autoscout24.be/lst';
    const merkSlug = merk.toLowerCase().replace(/\s+/g, '-');
    const modelSlug = model.toLowerCase().replace(/\s+/g, '-');
    const jaarMin = Math.max(parseInt(jaar) - 1, 2000);
    const jaarMax = parseInt(jaar) + 1;
    const kmMax = Math.round(parseInt(km) * 1.3);

    let url = `${base}/${merkSlug}/${modelSlug}?fregfrom=${jaarMin}&fregto=${jaarMax}&kmto=${kmMax}&cy=B&atype=C`;
    if (brandstof) url += `&fuel=${brandstof}`;
    if (transmissie) url += `&gear=${transmissie}`;
    url += '&sort=standard&desc=0&ustate=N%2CU';
    return url;
  }

  function formatEur(val) {
    return '€' + Math.round(val).toLocaleString('nl-BE');
  }

  async function startAnalyse() {
    const merk = document.getElementById('merk').value.trim();
    const model = document.getElementById('model').value.trim();
    const jaar = document.getElementById('jaar').value.trim();
    const km = document.getElementById('km').value.trim();
    const uitvoering = document.getElementById('uitvoering').value.trim();
    const brandstof = document.getElementById('brandstof').value;
    const transmissie = document.getElementById('transmissie').value;
    const aankoopprijs = parseFloat(document.getElementById('aankoopprijs').value);
    const margeWens = parseFloat(document.getElementById('marge').value) || 15;

    const errBox = document.getElementById('errorBox');
    errBox.classList.remove('active');

    if (!merk || !model || !jaar || !km || isNaN(aankoopprijs)) {
      errBox.textContent = '⚠️ Vul minstens merk, model, bouwjaar, km-stand en aankoopprijs in.';
      errBox.classList.add('active');
      return;
    }

    // Build AutoScout URL
    const scoutUrl = buildAutoScoutUrl(merk, model, jaar, km, brandstof, transmissie);
    const linkEl = document.getElementById('scoutLink');
    document.getElementById('scoutUrl').textContent = scoutUrl;
    linkEl.href = scoutUrl;
    linkEl.style.display = 'flex';

    // Show loader
    document.getElementById('analyseBtn').disabled = true;
    document.getElementById('loader').classList.add('active');
    document.getElementById('result').classList.remove('active');

    // Build prompt
    const voertuig = `${merk} ${model}${uitvoering ? ' ' + uitvoering : ''}, bouwjaar ${jaar}, ${parseInt(km).toLocaleString('nl-BE')} km${brandstof ? ', brandstof: ' + brandstof : ''}${transmissie ? ', transmissie: ' + transmissie : ''}`;

    const prompt = `Je bent een expert Belgische automarkt analist. Een autohandelaar (Bass Motors, dealer in Antwerpen/Limburg/Vlaams-Brabant) vraagt je een snelle marktanalyse.

VOERTUIG: ${voertuig}
AANKOOPPRIJS HANDELAAR: €${aankoopprijs.toLocaleString('nl-BE')}
GEWENSTE MARGE: ${margeWens}%

Geef me een gestructureerde analyse in het NEDERLANDS met:

1. MARKTWAARDE SCHATTING: Geef een realistische marktprijs range voor dit voertuig op de Belgische tweedehandsmarkt (gebaseerd op AutoScout24 BE, 2dehands.be, etc.). Geef een minimum, gemiddelde en maximum marktprijs.

2. MARGE ANALYSE: 
   - Is de aankoopprijs van €${aankoopprijs.toLocaleString('nl-BE')} interessant voor de handelaar?
   - Wat is de geschatte brutowinst als hij verkoopt aan marktprijs?
   - Wat is de aanbevolen verkoopprijs rekening houdend met kosten (keuring, poetsen, kleine herstellingen ~€500-800)?

3. VERDICT: Geef een duidelijk oordeel: INTERESSANT / MARGINAAL / NIET INTERESSANT

4. MARKTINZICHTEN: 2-3 korte tips specifiek voor dit voertuig (vraag & aanbod, seizoen, typische kopers, aandachtspunten).

Formaat: Begin met een JSON-blok (enkel dit):
{"marktMin": GETAL, "marktGem": GETAL, "marktMax": GETAL, "aanbevolen": GETAL, "verdict": "GO|MAYBE|NOGO"}
Daarna de volledige analyse als tekst.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await response.json();
      const fullText = data.content.map(b => b.text || '').join('');

      // Parse JSON block
      const jsonMatch = fullText.match(/\{[^}]+\}/);
      let marktData = null;
      if (jsonMatch) {
        try { marktData = JSON.parse(jsonMatch[0]); } catch(e) {}
      }

      const analyseText = fullText.replace(/\{[^}]+\}/, '').trim();

      document.getElementById('loader').classList.remove('active');

      if (marktData) {
        const { marktMin, marktGem, marktMax, aanbevolen, verdict } = marktData;
        const winst = aanbevolen - aankoopprijs - 650; // ~€650 kosten
        const winstPct = ((winst / aankoopprijs) * 100).toFixed(1);
        const doelprijs = aankoopprijs * (1 + margeWens / 100);

        // Verdict
        const verdictEl = document.getElementById('verdict');
        verdictEl.className = 'verdict ' + (verdict === 'GO' ? 'go' : verdict === 'NOGO' ? 'nogo' : 'maybe');
        document.getElementById('verdictIcon').textContent = verdict === 'GO' ? '✅' : verdict === 'NOGO' ? '🚫' : '⚠️';
        document.getElementById('verdictTitle').textContent = verdict === 'GO' ? 'Interessant!' : verdict === 'NOGO' ? 'Niet interessant' : 'Marginaal';
        document.getElementById('verdictSub').textContent = `Marktprijs ~${formatEur(marktGem)} · Jouw doel ${formatEur(doelprijs)}`;

        // Metrics
        document.getElementById('metMarkt').textContent = formatEur(marktGem);
        document.getElementById('metMarktSub').textContent = `Range: ${formatEur(marktMin)} – ${formatEur(marktMax)}`;

        document.getElementById('metAankoop').textContent = formatEur(aankoopprijs);
        document.getElementById('metAankoop').className = 'metric-value';

        const winstEl = document.getElementById('metWinst');
        winstEl.textContent = formatEur(winst);
        winstEl.className = 'metric-value ' + (winst > 0 ? 'green' : 'red');
        document.getElementById('metWinstSub').textContent = `${winstPct}% na kosten (~€650)`;

        document.getElementById('metVerkoop').textContent = formatEur(aanbevolen);
        document.getElementById('metVerkoopSub').textContent = `Streefprijs op AutoScout`;
      }

      document.getElementById('aiAnalyse').textContent = analyseText;

      // Scout link in result
      document.getElementById('scoutUrlResult').textContent = 'AutoScout24 — ' + merk + ' ' + model + ' (' + jaar + ')';
      document.getElementById('scoutLinkResult').href = scoutUrl;

      document.getElementById('result').classList.add('active');

    } catch (err) {
      document.getElementById('loader').classList.remove('active');
      errBox.textContent = '⚠️ Fout bij analyse: ' + err.message;
      errBox.classList.add('active');
    }

    document.getElementById('analyseBtn').disabled = false;
  }

  function resetForm() {
    document.getElementById('result').classList.remove('active');
    document.getElementById('errorBox').classList.remove('active');
    document.getElementById('scoutLink').style.display = 'none';
    document.getElementById('analyseBtn').disabled = false;
  }
</script>
</body>
</html>
